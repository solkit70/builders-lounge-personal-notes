<title>Builders Lounge 교집합 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Layout: 부스 페이지(#about 의 vision 문단 바로 아래)에 들어갈 한 블록 — 좌 벤 다이어그램 / 우 세 교집합 설명, 아래 선순환 한 줄 */
  :root{
    --bg:#F1F3F1; --surface:#FFFFFF; --surface-2:#E7ECE8;
    --line:#D2DBD5; --line-strong:#B7C4BC;
    --ink:#12201A; --ink-dim:#46564C; --ink-faint:#75897E;
    --accent:#2F7D5A; --accent-ink:#FFFFFF; --accent-soft:#DCEEE3;
    --accent2:#3159C7; --accent2-soft:#E1E7FB;
    --member:#8A5A16; --member-soft:#F7ECD9;
    --radius-lg:20px; --radius-md:14px; --radius-sm:9px;
    --font-display:'Noto Serif KR','Noto Serif',serif;
    --font-body:'Noto Sans KR','Noto Sans',-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1613; --surface:#152019; --surface-2:#1C2A22;
      --line:#2B3D33; --line-strong:#37503F;
      --ink:#E9F2EC; --ink-dim:#A9C0B3; --ink-faint:#78907F;
      --accent:#57C98C; --accent-ink:#082014; --accent-soft:#173826;
      --accent2:#93A9FF; --accent2-soft:#1C2657;
      --member:#E8B96A; --member-soft:#33270F;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1613; --surface:#152019; --surface-2:#1C2A22;
    --line:#2B3D33; --line-strong:#37503F;
    --ink:#E9F2EC; --ink-dim:#A9C0B3; --ink-faint:#78907F;
    --accent:#57C98C; --accent-ink:#082014; --accent-soft:#173826;
    --accent2:#93A9FF; --accent2-soft:#1C2657;
    --member:#E8B96A; --member-soft:#33270F;
    color-scheme:dark;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:16px; line-height:1.65;
    word-break:keep-all; overflow-wrap:break-word;
  }
  h2,h3{ font-family:var(--font-display); font-weight:700; text-wrap:balance; margin:0; }
  p{ margin:0; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  .wrap{ max-width:760px; margin:0 auto; padding-inline:22px; padding-block:24px 64px; display:grid; gap:22px; }
  @media (max-width:480px){ .wrap{ padding-inline:16px; } }

  /* 시안 안내 (실제 페이지에는 들어가지 않음) */
  .draft-note{
    display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between;
    padding:12px 16px; border:1px dashed var(--line-strong); border-radius:var(--radius-md);
    font-size:13.5px; color:var(--ink-dim); background:var(--surface-2);
  }
  .draft-note b{ color:var(--ink); }
  .lang-toggle{ display:flex; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px; }
  .lang-toggle button{
    font-family:var(--font-mono); font-size:12px; font-weight:600; letter-spacing:.04em;
    border:none; background:transparent; color:var(--ink-faint); padding:6px 13px; border-radius:999px; cursor:pointer;
  }
  .lang-toggle button.active{ background:var(--accent); color:var(--accent-ink); }

  /* 앞 문단 맥락 (페이지의 기존 vision 문단) */
  .vision{
    padding:20px 22px; border-radius:var(--radius-lg);
    background:linear-gradient(135deg, var(--accent-soft), var(--accent2-soft));
    font-family:var(--font-display); font-size:16.5px; line-height:1.7; color:var(--ink);
    opacity:.55;
  }
  .ctx-label{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:-12px; }

  /* 교집합 블록 */
  .overlap{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:26px 24px; display:grid; gap:22px;
  }
  .eyebrow{ font-family:var(--font-mono); font-size:12px; font-weight:600; letter-spacing:.12em; color:var(--accent); text-transform:uppercase; }
  .overlap h2{ font-size:clamp(21px,3.2vw,25px); line-height:1.35; margin-top:6px; }
  .overlap .lead{ color:var(--ink-dim); font-size:15px; max-width:60ch; margin-top:10px; }

  .body{ display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap:20px; align-items:center; }
  @media (max-width:640px){ .body{ grid-template-columns:1fr; } }

  .venn{ width:100%; max-width:380px; margin:0 auto; display:block; }
  .c-bl{ fill:var(--accent); fill-opacity:.16; stroke:var(--accent); stroke-width:1.6; }
  .c-a { fill:var(--accent2); fill-opacity:.13; stroke:var(--accent2); stroke-width:1.6; }
  .c-b { fill:var(--member); fill-opacity:.13; stroke:var(--member); stroke-width:1.6; }
  .lbl{ font-family:var(--font-body); font-weight:700; font-size:14px; fill:var(--ink); text-anchor:middle; }
  .lbl-sm{ font-family:var(--font-body); font-weight:500; font-size:11.5px; fill:var(--ink-dim); text-anchor:middle; }
  .num-bg{ fill:var(--surface); stroke:var(--ink); stroke-width:1.4; }
  .num{ font-family:var(--font-mono); font-weight:600; font-size:13px; fill:var(--ink); text-anchor:middle; dominant-baseline:central; }
  .core{ font-family:var(--font-display); font-weight:700; font-size:12.5px; fill:var(--ink); text-anchor:middle; }

  .cases{ list-style:none; margin:0; padding:0; display:grid; gap:12px; }
  .case{ display:grid; grid-template-columns:28px minmax(0,1fr); gap:10px; align-items:start; }
  .case .n{
    width:26px; height:26px; border-radius:50%; border:1.4px solid var(--ink);
    display:grid; place-items:center; font-family:var(--font-mono); font-weight:600; font-size:13px; background:var(--surface);
  }
  .case .kind{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:.06em; color:var(--ink-faint); text-transform:uppercase; }
  .case h3{ font-size:15.5px; line-height:1.4; margin-top:1px; }
  .case p{ font-size:13.5px; color:var(--ink-dim); margin-top:3px; }
  .case .soon{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; color:var(--member); border:1px solid currentColor; border-radius:999px; padding:1px 7px; margin-left:6px; vertical-align:2px; }

  /* 선순환 */
  .cycle-wrap{ border-top:1px solid var(--line); padding-top:18px; display:grid; gap:10px; }
  .cycle-title{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); }
  .cycle{ list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; align-items:center; gap:8px 6px; }
  .cycle li{ display:flex; align-items:center; gap:6px; }
  .cycle .step{
    font-size:13.5px; font-weight:600; padding:6px 12px; border-radius:999px;
    background:var(--accent-soft); color:var(--ink); white-space:nowrap;
  }
  .cycle .arr{ color:var(--ink-faint); font-family:var(--font-mono); }
  .cycle .back{ font-family:var(--font-mono); font-size:12px; color:var(--accent); white-space:nowrap; }

  .sentence{ font-family:var(--font-display); font-size:16px; line-height:1.7; color:var(--ink); }
</style>

<main class="wrap">

  <div class="draft-note">
    <span><b>시안</b> · 부스 페이지 「여기 오시면 이런 것을 얻습니다」 아래, vision 문단 다음에 들어갈 블록. GOBI 이름은 강민석 님 확인 뒤 공개.</span>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button id="btn-ko" class="active" type="button">KO</button>
      <button id="btn-en" type="button">EN</button>
    </div>
  </div>

  <p class="ctx-label" data-i="ctx">바로 위 — 지금 페이지의 기존 문단</p>
  <p class="vision" data-i="vision"></p>

  <section class="overlap" aria-labelledby="ov-h">
    <div>
      <span class="eyebrow" data-i="eyebrow"></span>
      <h2 id="ov-h" data-i="h2"></h2>
      <p class="lead" data-i="lead"></p>
    </div>

    <div class="body">
      <svg class="venn" viewBox="0 0 400 350" role="img" aria-labelledby="venn-t">
        <title id="venn-t" data-i="venn_t"></title>
        <circle class="c-bl" cx="200" cy="122" r="108"/>
        <circle class="c-a"  cx="138" cy="226" r="108"/>
        <circle class="c-b"  cx="262" cy="226" r="108"/>

        <text class="lbl" x="200" y="46" data-i="c_bl"></text>
        <text class="lbl-sm" x="200" y="64" data-i="c_bl_s"></text>

        <text class="lbl" x="82" y="290" data-i="c_a"></text>
        <text class="lbl-sm" x="82" y="308" data-i="c_a_s"></text>

        <text class="lbl" x="318" y="290" data-i="c_b"></text>
        <text class="lbl-sm" x="318" y="308" data-i="c_b_s"></text>

        <circle class="num-bg" cx="126" cy="158" r="14"/><text class="num" x="126" y="158">1</text>
        <circle class="num-bg" cx="274" cy="158" r="14"/><text class="num" x="274" y="158">2</text>
        <circle class="num-bg" cx="200" cy="284" r="14"/><text class="num" x="200" y="284">3</text>

        <text class="core" x="200" y="192" data-i="core1"></text>
        <text class="core" x="200" y="209" data-i="core2"></text>
      </svg>

      <ol class="cases">
        <li class="case">
          <span class="n" aria-hidden="true">1</span>
          <div>
            <span class="kind" data-i="k1"></span>
            <h3 data-i="t1"></h3>
            <p data-i="d1"></p>
          </div>
        </li>
        <li class="case">
          <span class="n" aria-hidden="true">2</span>
          <div>
            <span class="kind" data-i="k2"></span>
            <h3 data-i="t2"></h3>
            <p data-i="d2"></p>
          </div>
        </li>
        <li class="case">
          <span class="n" aria-hidden="true">3</span>
          <div>
            <span class="kind" data-i="k3"></span>
            <h3 data-i-html="t3"></h3>
            <p data-i="d3"></p>
          </div>
        </li>
      </ol>
    </div>

    <div class="cycle-wrap">
      <span class="cycle-title" data-i="cycle_t"></span>
      <ol class="cycle" id="cycle"></ol>
      <p class="sentence" data-i="closing"></p>
    </div>
  </section>

</main>

<script>
  const STR = {
    ctx:     { ko:"바로 위 — 지금 페이지의 기존 문단", en:"Just above — the existing paragraph on the page" },
    vision:  { ko:"Builders Lounge 는 AI 시대 Builder 들의 네트워킹 공간이자, 그 네트워킹 기록을 바탕으로 AI Agent 가 내가 하는 일에 조언을 주고 사람을 소개해 주는 곳이 되려 합니다.", en:"Builders Lounge aims to be a networking space for builders in the AI era — and, drawing on those networking records, a place where an AI agent advises you on your work and introduces you to the right people." },
    eyebrow: { ko:"교집합을 함께 키웁니다", en:"Growing the overlap" },
    h2:      { ko:"모임과 멤버가 겹치는 곳, 멤버와 멤버가 겹치는 곳을 찾아 함께 키웁니다", en:"We find where the community and its members overlap, and where members overlap, and grow it together" },
    lead:    { ko:"당신이 만들고 있는 것과 이 모임이 겹치는 곳, 그리고 당신과 다른 멤버가 겹치는 곳이 있습니다. 그 교집합을 함께 키우면 양쪽 모두가 잘됩니다. 키워 온 과정을 기록으로 남기면 다른 멤버에게도 도움이 되고, 모임이 커지면서 새로운 교집합이 또 생깁니다.",
               en:"What you're building overlaps with what this community needs, and with what other members are building. Grow that overlap together, and both sides do well. We keep a record of each story, so it helps the next member and opens new overlaps as the community grows." },
    venn_t:  { ko:"Builders Lounge 와 두 멤버의 원이 겹치는 벤 다이어그램. 겹친 곳 1·2·3 이 세 가지 교집합이다.",
               en:"Venn diagram of Builders Lounge and two members. Overlaps 1, 2 and 3 are the three kinds of overlap." },
    c_bl:    { ko:"Builders Lounge", en:"Builders Lounge" },
    c_bl_s:  { ko:"모임", en:"the community" },
    c_a:     { ko:"빌더 A", en:"Builder A" },
    c_a_s:   { ko:"멤버와 그의 회사", en:"a member and their company" },
    c_b:     { ko:"빌더 B", en:"Builder B" },
    c_b_s:   { ko:"다른 멤버 · 다른 모임", en:"another member or group" },
    core1:   { ko:"함께", en:"Growing" },
    core2:   { ko:"성장", en:"together" },
    k1:      { ko:"모임 × 멤버의 회사", en:"Community × a member's company" },
    t1:      { ko:"GOBI Space 채널 · @Bila AI", en:"GOBI Space channel · @Bila AI" },
    d1:      { ko:"모임에 필요한 기능이 GOBI 의 제품 요구사항이 되고, 모임은 AI Agent 가 돕는 온라인 공간을 얻습니다.", en:"What the community needs becomes GOBI's product requirements, and the community gets an online space with an AI agent helping out." },
    k2:      { ko:"모임 × 다른 모임", en:"Community × another group" },
    t2:      { ko:"다른 모임과 함께 여는 세미나 · 커피챗", en:"Seminars and coffee chats with other groups" },
    d2:      { ko:"앱을 만드는 사람만 빌더가 아닙니다. AI 로 세미나를 열고 사람을 잇는 모임도 빌더이고, Builders Lounge 도 그중 하나입니다. 7월 워싱턴주 한인상공회의소(KACC)와의 커피챗처럼 다른 모임과 함께 자리를 엽니다.", en:"Builders aren't only people who make apps. Groups that use AI to run seminars and connect people are builders too, and Builders Lounge is one of them. Like our July coffee chat with the Korean American Chamber of Commerce of Washington (KACC), we open events together with other groups." },
    k3:      { ko:"멤버 × 멤버", en:"Member × member" },
    t3:      { ko:"함께 만드는 비지니스 아이템<span class=\"soon\">NEXT</span>", en:"Business ideas built together<span class=\"soon\">NEXT</span>" },
    d3:      { ko:"@Bila AI 가 서로 도움이 될 멤버를 이어 주고, 멤버들도 스스로 교집합을 찾아 함께 진행합니다.", en:"@Bila AI connects members who can help each other, and members find their own overlaps and build on them." },
    cycle_t: { ko:"선순환", en:"The cycle" },
    steps:   { ko:["교집합 발견","함께 키우기","기록으로 남기기","모임 성장","새 교집합"],
               en:["Find an overlap","Grow it together","Keep a record","The community grows","New overlaps"] },
    back:    { ko:"↺ 다시 처음으로", en:"↺ and around again" },
    closing: { ko:"Builders Lounge 는 모임과 멤버, 멤버와 멤버 사이의 교집합을 찾아 함께 키우며, 모임과 멤버가 같이 성장하는 곳입니다.",
               en:"Builders Lounge finds the overlaps between the community and its members, and between members, and grows them together, so the community and its members grow at the same time." }
  };

  function render(lang){
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i]").forEach(el => {
      const k = el.getAttribute("data-i");
      el.textContent = (STR[k] && (STR[k][lang] || STR[k].ko)) || "";
    });
    document.querySelectorAll("[data-i-html]").forEach(el => {
      const k = el.getAttribute("data-i-html");
      el.innerHTML = STR[k][lang] || STR[k].ko;
    });
    const ol = document.getElementById("cycle");
    const steps = STR.steps[lang];
    ol.innerHTML = steps.map((s, i) =>
      `<li><span class="step">${s}</span>${i < steps.length - 1 ? '<span class="arr" aria-hidden="true">→</span>' : ''}</li>`
    ).join("") + `<li><span class="back">${STR.back[lang]}</span></li>`;
    document.getElementById("btn-ko").classList.toggle("active", lang === "ko");
    document.getElementById("btn-en").classList.toggle("active", lang === "en");
    try { localStorage.setItem("ov-lang", lang); } catch(e) {}
  }
  document.getElementById("btn-ko").addEventListener("click", () => render("ko"));
  document.getElementById("btn-en").addEventListener("click", () => render("en"));
  let initial = "ko";
  try { initial = localStorage.getItem("ov-lang") || "ko"; } catch(e) {}
  render(initial);
</script>
